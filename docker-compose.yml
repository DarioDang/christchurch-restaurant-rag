services:
  # ============================================
  # 1. Phoenix - Local Observability (dev only)
  # ============================================
  # This is a SEPARATE, self-hosted Phoenix instance for local docker-compose
  # development — isolated from Phoenix Cloud (used in production on Cloud Run,
  # configured via .env's PHOENIX_API_KEY / PHOENIX_COLLECTOR_ENDPOINT pointing
  # at app.phoenix.arize.com). Running locally here means local test traces
  # never touch the cloud project.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    ports:
      - "6006:6006"   # UI + HTTP collector
      - "4317:4317"   # gRPC collector (optional)
    volumes:
      - phoenix-data:/phoenix
    restart: unless-stopped
    networks:
      - rag-network

  # ============================================
  # 2. API - FastAPI Backend
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override .env's Phoenix Cloud settings to point at the local
      # self-hosted Phoenix container instead, for local dev only.
      - PORT=8000
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    volumes:
      # Bind-mount source for live --reload during local dev. Production
      # (Cloud Run) builds a fresh immutable image from the Dockerfile and
      # never uses this volume or --reload.
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - phoenix
    restart: unless-stopped
    networks:
      - rag-network

  # ============================================
  # 3. Evaluation Worker
  # ============================================
  eval-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: eval-worker
    env_file:
      - .env
    environment:
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    volumes:
      - ./data:/app/data
      - checkpoint-data:/checkpoint
    depends_on:
      - phoenix
    restart: unless-stopped
    networks:
      - rag-network
    command: python -m evaluation.worker

# ============================================
# Networks
# ============================================
networks:
  rag-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  phoenix-data:
    driver: local
  checkpoint-data:
    driver: local