<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Christchurch Dining — AI Restaurant Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
        <div class="header__brand">
            <span class="header__mark">◆</span>
            <h1 class="header__title">Christchurch Dining</h1>
        </div>
        <div class="header__right">
            <p class="header__stats" id="stats"></p>
            <div class="location">
            <button type="button" id="location-btn" class="location__btn" aria-label="Location settings" aria-expanded="false">📍</button>
            <div class="location__panel" id="location-panel" hidden>
                <p class="location__header">Location</p>
                <label class="location__row" for="location-toggle">
                    <span>Use my location</span>
                    <span class="toggle">
                    <input type="checkbox" id="location-toggle" class="toggle__input" />
                    <span class="toggle__track"><span class="toggle__thumb"></span></span>
                    </span>
                </label>
                <div class="location__distance" id="location-distance" hidden>
                    <label for="distance-slider">Search radius: <span id="distance-value">5</span>km</label>
                    <input type="range" id="distance-slider" min="1" max="20" step="1" value="5" />
                </div>
                <p class="location__status" id="location-status"></p>
            </div>
            </div>
        </div>
    </header>

    <main class="chat" id="chat" aria-live="polite"></main>

    <form class="composer" id="composer">
      <input
        type="text"
        id="message-input"
        class="composer__input"
        placeholder="Ask about restaurants in Christchurch…"
        autocomplete="off"
      />
      <button type="submit" id="send-btn" class="composer__send" aria-label="Send">→</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
