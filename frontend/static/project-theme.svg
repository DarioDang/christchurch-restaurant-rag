<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="goldGlow" cx="15%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#D7A34E" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#D7A34E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="riverGlow" cx="100%" cy="105%" r="65%">
      <stop offset="0%" stop-color="#6E8C97" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6E8C97" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#12201B"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>
  <rect width="1200" height="630" fill="url(#riverGlow)"/>

  <!-- Faint abstract skyline, grounding the Christchurch setting without being literal -->
  <g opacity="0.06" fill="#EDEAE2">
    <rect x="0" y="565" width="1200" height="65"/>
    <rect x="55" y="505" width="48" height="60"/>
    <rect x="135" y="475" width="38" height="90"/>
    <polygon points="205,565 225,425 245,565"/>
    <rect x="295" y="515" width="58" height="50"/>
    <rect x="905" y="485" width="52" height="80"/>
    <rect x="1000" y="515" width="42" height="50"/>
    <rect x="1075" y="498" width="38" height="67"/>
  </g>

  <!-- Oversized decorative mark, echoes the header's diamond glyph -->
  <rect x="55" y="215" width="180" height="180" rx="26" fill="#D7A34E" opacity="0.08" transform="rotate(20 145 305)"/>

  <!-- Chat UI mockup card -->
  <g filter="url(#cardShadow)">
    <rect x="430" y="95" width="650" height="440" rx="22" fill="#1B2B23" stroke="rgba(237,234,226,0.14)" stroke-width="1.5"/>
  </g>

  <!-- Header row -->
  <rect x="465" y="128" width="24" height="24" rx="5" fill="#D7A34E" transform="rotate(45 477 140)"/>
  <text x="503" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#EDEAE2">Christchurch Dining AI Agent</text>
  <line x1="465" y1="174" x2="1045" y2="174" stroke="rgba(237,234,226,0.14)" stroke-width="1"/>

  <!-- User message -->
  <rect x="705" y="202" width="340" height="46" rx="14" fill="#223830"/>
  <text x="728" y="231" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#EDEAE2">Best ramen open right now?</text>

  <!-- Trace strip — the signature transparency element from the real app -->
  <circle cx="475" cy="278" r="4" fill="#D7A34E"/>
  <text x="490" y="283" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#B9C2BC">found 3 results · direct_filtered_cross_encoder_reranked</text>

  <!-- Assistant response -->
  <rect x="465" y="302" width="500" height="96" rx="14" fill="#1B2B23" stroke="rgba(237,234,226,0.14)" stroke-width="1"/>
  <text x="488" y="333" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#EDEAE2">Hayaku Ramen is open until 9 PM, about 0.8km</text>
  <text x="488" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#EDEAE2">away — known for rich tonkotsu broth and quick</text>
  <text x="488" y="383" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#EDEAE2">service.</text>

  <!-- Composer mockup -->
  <rect x="465" y="455" width="450" height="50" rx="25" fill="#223830" stroke="rgba(237,234,226,0.14)" stroke-width="1"/>
  <text x="490" y="485" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#B9C2BC">Ask about restaurants in Christchurch…</text>
  <circle cx="955" cy="480" r="24" fill="#D7A34E"/>
  <text x="955" y="487" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#12201B" text-anchor="middle">→</text>

  <!-- Bottom-left caption -->
  <text x="60" y="558" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="2" fill="#B9C2BC">RAG · HYBRID SEARCH · STREAMING</text>
</svg>
